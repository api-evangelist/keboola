openapi: 3.2.0
info:
  contact:
    email: support@keboola.com
    name: Keboola Support
    url: https://help.keboola.com/management/support/
  description: A service for managing and executing SQL query jobs with support for transactional operations and job status tracking.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Query Service Health API
  version: 1.0.0
servers:
- url: https://query.north-europe.azure.keboola.com/
tags:
- name: health
paths:
  /health-check:
    get:
      summary: Health check
      operationId: ''
      tags:
      - health
      description: Get the health status of the service
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
components:
  securitySchemes:
    StorageApiToken:
      type: apiKey
      name: X-StorageAPI-Token
      in: header
